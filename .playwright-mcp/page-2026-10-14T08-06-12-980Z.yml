                - heading "Admission Rules & Regulations" [level=4] [ref=f33e239]
              - generic [ref=f33e241]:
                - paragraph [ref=f33e242]:
                  - strong [ref=f33e243]: "Authority:"
                  - text: The Head of the Institution has the final discretion to admit or refuse any child. Management reserves the right to amend these rules at any time.
                - paragraph [ref=f33e244]:
                  - strong [ref=f33e245]: "Fees:"
                  - text: There are no fee concessions. Fees are non-refundable, even if admission is cancelled in the middle of the academic year.
                - paragraph [ref=f33e246]:
                  - strong [ref=f33e247]: "Liability:"
                  - text: Students should not bring money or valuables to school. The school is not responsible for any loss.
                - paragraph [ref=f33e248]:
                  - strong [ref=f33e249]: "Age Criteria:"
                  - text: The minimum age for admission to each class shall be in accordance with the National Education Policy (NEP) 2020 norms and applicable government regulations.
                - paragraph [ref=f33e250]:
                  - strong [ref=f33e251]: "Documentation:"
                  - text: All required documents must be submitted at the time of admission. Admission cannot be finalized without the complete set of documents listed in the form.
                - paragraph [ref=f33e252]:
                  - strong [ref=f33e253]: "Transfer Students:"
                  - text: For Classes II –X, a School Leaving Certificate and Mark Sheet are mandatory. Out-of-state certificates must be countersigned by the Education Officer.
                - paragraph [ref=f33e254]:
                  - strong [ref=f33e255]: "Health Disclosure:"
                  - text: Parents must disclose any physical or mental health issues before admission. Hiding this information may lead to admission cancellation.
                - paragraph [ref=f33e256]:
                  - strong [ref=f33e257]: "Attendance:"
                  - text: Prior leave applications are mandatory. Medical absences exceeding three days require a doctor's certificate. Unexplained absence for over a month will result in the student's name being struck off the register.
                - paragraph [ref=f33e258]:
                  - strong [ref=f33e259]: "Code of Conduct:"
                  - text: The school enforces a zero-tolerance policy for misconduct. Fighting, abusive language, bullying, or disrespect toward staff or peers will result in immediate disciplinary action, including the possibility of expulsion.
                - paragraph [ref=f33e260]:
                  - strong [ref=f33e261]: "Uniform & Grooming:"
                  - text: The school uniform is mandatory; students not in compliance will be sent home. Hair must be kept simple and neat. Fashionable styles, coloring, or long hair (for boys) are strictly prohibited.
